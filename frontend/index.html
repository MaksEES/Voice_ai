<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max — Voice OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="desktop-wallpaper">
        <div class="gradient-overlay"></div>
        <div class="bokeh-container">
            <div class="bokeh bokeh-1"></div>
            <div class="bokeh bokeh-2"></div>
            <div class="bokeh bokeh-3"></div>
        </div>
    </div>

    <!-- Кнопка вызова боковой панели -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" title="История чатов">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div class="os-layout">
        <aside class="sidebar-history glass-card" id="sidebar">
            <div class="sidebar-header">
                <h2>История чатов</h2>
                <button id="new-chat-btn" class="new-chat-btn" title="Новый чат">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="chat-container" id="chat-history">
            </div>
        </aside>

        <main class="os-workspace">
            <header class="os-header">
                <div class="status-group">
                    <span class="date" id="current-date">Четверг, 29 Января</span>
                    <span class="clock" id="current-time">09:31</span>
                </div>
            </header>

            <div class="center-stage">
                <div class="voice-hub-wrapper">
                    <div class="voice-hub" id="voice-hub">

                        <!-- Mic orb area -->
                        <div class="mic-orb-area" id="mic-toggle">
                            <!-- Pulse rings (visible when active) -->
                            <div class="pulse-ring pulse-ring-1"></div>
                            <div class="pulse-ring pulse-ring-2"></div>
                            <div class="pulse-ring pulse-ring-3"></div>

                            <!-- Glow backdrop -->
                            <div class="orb-glow"></div>

                            <!-- Main orb -->
                            <div class="mic-orb">
                                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                                </svg>
                            </div>

                            <!-- Waveform bars around orb -->
                            <div class="waveform-ring">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                        </div>

                        <div class="voice-labels">
                            <div class="status-badge" id="status-badge">
                                <span class="status-dot"></span>
                                <span id="status-text">Система готова</span>
                            </div>
                            <p id="sub-status">Скажите «Макс» или нажмите на микрофон</p>
                        </div>
                    </div>

                    <div class="glass-card user-text-window" id="user-text-window" style="opacity: 0;">
                        <p id="user-text-display">...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
