<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="desktop-wallpaper">
        <div class="gradient-overlay"></div>
        <div class="bokeh-container">
            <div class="bokeh bokeh-1"></div>
            <div class="bokeh bokeh-2"></div>
            <div class="bokeh bokeh-3"></div>
        </div>
    </div>

    <!-- Кнопка вызова боковой панели -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" title="История чатов">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div class="os-layout">
        <aside class="sidebar-history glass-card" id="sidebar">
            <div class="sidebar-header">
                <h2>История чатов</h2>
                <button id="new-chat-btn" class="new-chat-btn" title="Новый чат">+</button>
            </div>
            <div class="chat-container" id="chat-history">
                <!-- Сюда динамически добавляются сгруппированные чаты -->
            </div>
        </aside>

        <main class="os-workspace">
            <header class="os-header">
                <div class="status-group">
                    <span class="date" id="current-date">Четверг, 29 Января</span>
                    <span class="clock" id="current-time">09:31</span>
                </div>
            </header>

            <div class="center-stage">
                <div class="voice-hub-wrapper">
                    <div class="glass-card voice-hub">
                        <div class="visualizer-container" id="visualizer">
                            <div class="waveform">
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                            </div>
                            <div class="main-orb"></div>
                            <div class="glow-sphere"></div>
                        </div>
                        <div class="voice-labels">
                            <h1 id="status-text">Система готова</h1>
                            <p id="sub-status">Скажите команду</p>
                        </div>
                        <button class="prime-mic-btn" id="mic-toggle">
                            <div class="mic-inner">🎤</div>
                            <div class="mic-wave"></div>
                        </button>
                    </div>

                    <!-- Окно субтитров -->
                    <div class="glass-card user-text-window" id="user-text-window" style="opacity: 0;">
                        <p id="user-text-display">...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
